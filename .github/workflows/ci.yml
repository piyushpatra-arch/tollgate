name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - run: uv sync --frozen
      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Policy tests
        run: opa test policies/ -v
      - name: Python tests (includes real-OPA integration tests)
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tollgate:ci .
