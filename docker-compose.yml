# Tollgate local stack.  `docker compose up -d --build`
#
# Ollama runs on the HOST by default (on macOS, Docker cannot use the GPU).
# Linux alternative: `docker compose --profile ollama up -d` and set
# OLLAMA_API_BASE=http://ollama:11434 in .env
services:
  gateway:
    build: .
    ports: ["8080:8080"]
    environment:
      TOLLGATE_DATABASE_URL: postgresql+psycopg://tollgate:tollgate@postgres:5432/tollgate
      TOLLGATE_OPA_URL: http://opa:8181
      TOLLGATE_OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./config:/app/config:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      opa: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tollgate
      POSTGRES_PASSWORD: tollgate   # local demo only
      POSTGRES_DB: tollgate
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tollgate"]
      interval: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa:latest   # pin a version for anything beyond a demo
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error", "/policies"]
    ports: ["8181:8181"]
    volumes: ["./policies:/policies:ro"]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tollgate.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, postgres]

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  pgdata:
  ollama:
